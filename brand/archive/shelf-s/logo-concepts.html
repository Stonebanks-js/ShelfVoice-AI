<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shelf Voice AI logo concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  :root { --sheet: #ECEEEE; --ink: #16201F; --muted: #5B6766; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1800px; background: var(--sheet); font-family: "Baloo 2", system-ui, sans-serif; color: var(--ink); padding: 56px 60px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 36px; }
  header h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; }
  header p { font-size: 20px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .card { background: #fff; border-radius: 28px; padding: 30px 32px 28px; display: flex; flex-direction: column; gap: 22px; }
  .card h2 { font-size: 28px; font-weight: 800; line-height: 1; display: flex; gap: 12px; align-items: baseline; }
  .card h2 span { font-size: 18px; font-weight: 600; color: var(--muted); }
  .card .idea { font-size: 17px; line-height: 1.35; color: var(--muted); margin-top: -12px; min-height: 46px; }

  .hero { display: flex; gap: 22px; align-items: center; }
  .appicon { width: 132px; height: 132px; border-radius: 30px; background: var(--m); flex: none; display: grid; place-items: center; }
  .appicon svg { width: 96px; height: 96px; }
  .lockup { display: flex; align-items: center; gap: 10px; }
  .lockup svg { width: 64px; height: 64px; flex: none; }
  .word { font-weight: 800; font-size: 34px; letter-spacing: -0.6px; line-height: 1; color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .word .voice { color: var(--m); }
  .ai { font-size: 17px; font-weight: 800; color: var(--ink); background: var(--s); padding: 4px 9px 2px 15px; line-height: 1.1;
        clip-path: polygon(7px 0, 100% 0, 100% 100%, 7px 100%, 0 50%); border-radius: 0 6px 6px 0; position: relative; letter-spacing: 0.5px; }
  .ai::before { content: ""; position: absolute; left: 6px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: #fff; }

  .row { display: flex; gap: 14px; align-items: center; }
  .tile { border-radius: 18px; height: 92px; display: flex; align-items: center; padding: 0 18px; gap: 8px; }
  .tile.dark { background: #121615; flex: 1; }
  .tile.dark .word { color: #F3F5F4; font-size: 26px; }
  .tile.dark .word .voice { color: var(--m-dk); }
  .tile.dark svg { width: 50px; height: 50px; }
  .sizes { display: flex; align-items: flex-end; gap: 12px; padding: 0 6px; }
  .mini { background: var(--m); display: grid; place-items: center; }
  .mini.s48 { width: 48px; height: 48px; border-radius: 11px; } .mini.s48 svg { width: 35px; height: 35px; }
  .mini.s32 { width: 32px; height: 32px; border-radius: 7px; } .mini.s32 svg { width: 24px; height: 24px; }
  .mini.s20 { width: 20px; height: 20px; border-radius: 5px; } .mini.s20 svg { width: 15px; height: 15px; }

  .sticker { border: 2px dashed #C9D0CF; border-radius: 18px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex: 1; }
  .qr { width: 66px; height: 66px; flex: none; }
  .sticker b { display: block; font-size: 16px; font-weight: 800; line-height: 1.15; }
  .sticker small { font-size: 13px; color: var(--muted); line-height: 1.2; display: block; }

  .ui { display: flex; gap: 10px; align-items: center; }
  .btn { background: var(--m); color: #fff; font-weight: 700; font-size: 16px; border-radius: 12px; padding: 10px 16px 8px; }
  .pill { background: var(--tint); color: var(--m); font-weight: 700; font-size: 15px; border-radius: 999px; padding: 6px 12px 4px; }
  .low { background: var(--s); color: #16201F; font-weight: 700; font-size: 15px; border-radius: 999px; padding: 6px 12px 4px; }
  .paan .low { color: #fff; }
  .mic { width: 46px; height: 46px; border-radius: 50%; background: var(--m); display: grid; place-items: center; margin-left: auto; box-shadow: 0 6px 16px rgb(0 0 0 / 0.18); }
  .check { font-size: 14px; line-height: 1.35; color: var(--muted); border-top: 1px solid #E3E7E6; padding-top: 12px; }
  .check b { color: var(--ink); }
  .check.warn b { color: #9A5B00; }
  .palette { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .chip { display: flex; align-items: center; gap: 6px; margin-right: 8px; }
  .chip i { width: 22px; height: 22px; border-radius: 7px; display: inline-block; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }

  /* palettes */
  .teal   { --m: #0E5A5E; --m-dk: #5FC4BE; --s: #F29F05; --tint: #E3EFEE; }
  .indigo { --m: #26357A; --m-dk: #9AA8F0; --s: #FFB020; --tint: #E8EAF5; }
  .paan   { --m: #2E6B34; --m-dk: #8BCB86; --s: #D7263D; --tint: #E6F0E5; }
  .paan .ai { color: #fff; }
  .paan .ai::before { background: #fff; }

  /* symbol colour roles: f = main shape, c = cut-outs, k = spark */
  .on-light { --f: var(--m); --c: #fff; --k: var(--s); }
  .on-brand { --f: #fff; --c: var(--m); --k: var(--s); }
  .on-dark  { --f: var(--m-dk); --c: #121615; --k: var(--s); }
  .f { fill: var(--f); } .c { fill: var(--c); } .k { fill: var(--k); }
  .fs { stroke: var(--f); } .ks { stroke: var(--k); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 1. Bolti Shelf: a speech bubble that is a shop shelf -->
    <symbol id="s1" viewBox="0 0 100 100">
      <path class="f" d="M30 12H70A16 16 0 0 1 86 28V60A16 16 0 0 1 70 76H38L21 88.5Q14 93 14 85V28A16 16 0 0 1 30 12Z"/>
      <rect class="c" x="24" y="43" width="52" height="6" rx="3"/>
      <rect class="c" x="24" y="63" width="52" height="6" rx="3"/>
      <rect class="c" x="28" y="26" width="11" height="17" rx="3.5"/>
      <rect class="k" x="43" y="31" width="15" height="12" rx="3.5"/>
      <rect class="c" x="62" y="23" width="10" height="20" rx="3.5"/>
      <rect class="c" x="30" y="51" width="17" height="12" rx="3.5"/>
      <rect class="c" x="51" y="54" width="10" height="9" rx="3"/></symbol>

    <!-- 2. Bolta Tag: a price tag whose point carries a speech tail -->
    <symbol id="s2" viewBox="0 0 100 100">
      <path class="f" d="M45 20H73A15 15 0 0 1 88 35V56A15 15 0 0 1 73 71H69L58 83Q54 87 52.5 82L49 71H45Q40.5 71 37 68L15.5 51Q11 46 15.5 41L37 23Q40.5 20 45 20Z"/>
      <circle class="k" cx="30" cy="45.5" r="7"/>
      <rect class="c" x="48" y="35" width="28" height="7" rx="3.5"/>
      <rect class="c" x="48" y="49" width="17" height="7" rx="3.5"/></symbol>

    <!-- 3. Quote Shelf: two spoken quote marks resting on a shelf plank -->
    <symbol id="s3" viewBox="0 0 100 100">
      <path class="f" d="M20 57C20 41 28 30 41 24Q45.5 22 47 26.5Q48 30 44.5 32C38 36 35 40 34.5 43.1A14 14 0 1 1 20 57Z"/>
      <path class="f" d="M52 57C52 41 60 30 73 24Q77.5 22 79 26.5Q80 30 76.5 32C70 36 67 40 66.5 43.1A14 14 0 1 1 52 57Z"/>
      <rect class="k" x="12" y="76" width="76" height="9" rx="4.5"/></symbol>

    <!-- 4. Shelf V: a bracketed shelf (V for voice) holding a speech bubble -->
    <symbol id="s4" viewBox="0 0 100 100">
      <path class="k" d="M40 14H62A10 10 0 0 1 72 24V31A10 10 0 0 1 62 41H48L39.5 46.5Q36 48.5 36.5 44.5L37.6 39.3A10 10 0 0 1 30 31V24A10 10 0 0 1 40 14Z"/>
      <rect class="f" x="12" y="50" width="76" height="10" rx="5"/>
      <path class="fs" d="M27 60L50 85L73 60" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 5. Bill Bubble: a supplier bill that speaks -->
    <symbol id="s5" viewBox="0 0 100 100">
      <path class="f fs" stroke-width="3" stroke-linejoin="round" d="M36 12H66A14 14 0 0 1 80 26V84L74 79L68 84L62 79L56 84L50 79L44 84L38 79L32 84L26 79V47L15 42Q9.5 39.5 15 36.5L26 31V22A10 10 0 0 1 36 12Z"/>
      <rect class="c" x="36" y="26" width="34" height="6" rx="3"/>
      <rect class="c" x="36" y="39" width="24" height="6" rx="3"/>
      <rect class="c" x="36" y="52" width="30" height="6" rx="3"/>
      <rect class="k" x="48" y="64" width="22" height="8" rx="4"/></symbol>

    <!-- 6. Shelf S: an S drawn as a two-bay shelf, one item, one voice -->
    <symbol id="s6" viewBox="0 0 100 100">
      <path class="fs" d="M76 20H31Q23 20 23 28V42Q23 50 31 50H69Q77 50 77 58V72Q77 80 69 80H24" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="k" x="52" y="30" width="15" height="15" rx="4.5"/>
      <path class="f" d="M39 59H53A5.5 5.5 0 0 1 58.5 64.5V65A5.5 5.5 0 0 1 53 70.5H44L39.6 73.4Q37.8 74.4 38.1 72.4L38.4 70.3A5.5 5.5 0 0 1 33.5 65V64.5A5.5 5.5 0 0 1 39 59Z"/></symbol>

    <!-- simple QR stand-in for the counter sticker -->
    <symbol id="qr" viewBox="0 0 21 21">
      <path fill="#16201F" d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM14 0h7v7h-7zM15 1v5h5V1zM16 2h3v3h-3zM0 14h7v7H0zM1 15v5h5v-5zM2 16h3v3H2zM8 0h1v2H8zM10 1h2v1h-2zM9 3h2v2H9zM12 4h1v3h-1zM8 6h2v2H8zM0 8h2v1H0zM3 8h3v1H3zM7 9h2v2H7zM10 8h3v2h-3zM14 8h2v1h-2zM17 8h4v1h-4zM1 10h3v2H1zM5 11h1v2H5zM12 11h3v1h-3zM16 10h2v2h-2zM19 10h2v3h-2zM8 12h3v2H8zM14 13h2v2h-2zM17 13h1v3h-1zM8 15h1v3H8zM10 15h3v1h-3zM11 17h2v2h-2zM14 16h2v1h-2zM19 15h2v2h-2zM9 19h1v2H9zM14 18h3v3h-3zM18 18h1v1h-1zM20 19h1v2h-1z"/>
    </symbol>
  </defs>
</svg>

<header>
  <h1>Shelf Voice AI · logo concepts</h1>
  <p>Rooted and trusted · soft rounded · shelf meets voice, price tag and bill · three palettes</p>
</header>

<main class="grid" id="grid"></main>

<script>
const concepts = [
  { id: 1, name: "Bolti Shelf", hi: "बोलती शेल्फ", pal: "teal", check: "no brand found using a shelf inside a speech bubble. Busiest of the six; goods blur below 32 px.",
    idea: "The speech bubble is the shop shelf. Goods sit on two planks; the marigold one is the item the owner just spoke." },
  { id: 2, name: "Bolta Tag", hi: "बोलता टैग", pal: "teal", check: "no brand found combining a price tag and a speech bubble. Clear at 20 px.",
    idea: "A kirana price tag whose bottom grows a speech tail: the price you say becomes the price on the shelf." },
  { id: 3, name: "Quote Shelf", hi: "बात शेल्फ पर", pal: "indigo", check: "no shelf-and-quotes brand found, but quote marks are hard to register as a trademark (Off-White's attempts were refused), so this is the weakest to protect.", warn: true,
    idea: "Two spoken quote marks sit on a shelf plank like jars. Whatever is said ends up stocked." },
  { id: 4, name: "Shelf V", hi: "शेल्फ वी", pal: "indigo", check: "no match found; the V bracket is a plain triangle, so keep it away from V-chevron marks such as Vue.js.",
    idea: "A wall shelf on its V bracket (V for Voice) holding a speech bubble: the shop keeps every word." },
  { id: 5, name: "Bill Bubble", hi: "बोलता बिल", pal: "paan", check: "no app found pairing a bill and a speech bubble; receipt icons are common, so the tail does the work.",
    idea: "The supplier's torn-edge bill with a speech tail. Lines are items; the chilli bar is the total the AI read out." },
  { id: 6, name: "Shelf S", hi: "शेल्फ एस", pal: "paan", check: "no S-shaped shelf mark found among S monograms; S monograms in general are crowded.",
    idea: "An S drawn as a two-bay shelf: one bay holds stock, the other holds a voice. Reads as a monogram at any size." },
];
const swatch = { teal: [["#0E5A5E","Peacock teal"],["#F29F05","Marigold"],["#E3EFEE","Tint"]],
                 indigo: [["#26357A","Neel indigo"],["#FFB020","Mango"],["#E8EAF5","Tint"]],
                 paan: [["#2E6B34","Paan green"],["#D7263D","Chilli"],["#E6F0E5","Tint"]] };
const use = (id, cls) => `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><use href="#s${id}"/></svg>`;
document.getElementById("grid").innerHTML = concepts.map(c => `
  <section class="card ${c.pal}">
    <h2>${c.id}. ${c.name} <span>${c.hi}</span></h2>
    <p class="idea">${c.idea}</p>
    <div class="hero">
      <div class="appicon">${use(c.id, "on-brand")}</div>
      <div class="lockup">${use(c.id, "on-light")}
        <div class="word">Shelf <span class="voice">Voice</span><span class="ai">AI</span></div></div>
    </div>
    <div class="row">
      <div class="tile dark">${use(c.id, "on-dark")}<div class="word">Shelf <span class="voice">Voice</span><span class="ai">AI</span></div></div>
      <div class="sizes">
        <div class="mini s48">${use(c.id, "on-brand")}</div>
        <div class="mini s32">${use(c.id, "on-brand")}</div>
        <div class="mini s20">${use(c.id, "on-brand")}</div>
      </div>
    </div>
    <div class="row">
      <div class="sticker">
        <svg class="qr"><use href="#qr"/></svg>
        <div style="display:flex;gap:10px;align-items:center">
          <svg width="40" height="40" viewBox="0 0 100 100" class="on-light"><use href="#s${c.id}"/></svg>
          <div><b>Scan karke boliye</b><small>Leave a 15-second voice review</small></div>
        </div>
      </div>
    </div>
    <div class="ui"><span class="btn">Order karo</span><span class="pill">Aaj ki bikri</span><span class="low">3 bache</span>
      <span class="mic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span></div>
    <div class="palette">${swatch[c.pal].map(([h,n]) => `<span class="chip"><i style="background:${h}"></i>${n} ${h}</span>`).join("")}</div>
    <p class="check ${c.warn ? "warn" : ""}"><b>Look-alike check:</b> ${c.check}</p>
  </section>`).join("");
</script>
</body>
</html>
