# Doc 08 nightly jobs (W-03; errata E-14): an encrypted backup of the
# database with its own Better Stack heartbeat, and the AI job tests run
# against Meta's live models to catch drift. 02:30 IST, after the Vercel
# cleanup cron at 02:00.
name: nightly

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted database backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEARTBEAT: ${{ secrets.BETTERSTACK_BACKUP_HEARTBEAT_URL }}
    steps:
      # pg_dump must be at least the server's version (Postgres 17).
      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      # The session pooler connection string: GitHub runners have no IPv6,
      # which Supabase's direct connection needs. Rows and schema only;
      # recordings and photos stay in Storage.
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          name="shelfvoice-$(date -u +%Y-%m-%d).dump.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" --output "$name"
          [ "$(stat -c %s "$name")" -gt 10000 ] || { echo "Backup is suspiciously small"; exit 1; }
          echo "BACKUP=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BACKUP }}
          path: ${{ env.BACKUP }}
          retention-days: 7
          if-no-files-found: error

      # Better Stack alerts if this ping is late; /fail reports a failed run.
      - name: Heartbeat
        if: always() && env.HEARTBEAT != ''
        run: |
          url="${HEARTBEAT%/}"
          [ "${{ job.status }}" = "success" ] || url="$url/fail"
          curl -fsS -X POST "$url" > /dev/null

  evals:
    name: Live AI evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Meta models only (doc 04 "AI evaluation"); a few cents of credit a night.
      - name: Run the AI job tests against Meta
        env:
          META_MODE: live
          META_API_KEY: ${{ secrets.META_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
        run: pnpm exec vitest run tests/live
      - name: Tell Discord about a failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          curl -fsS -H "content-type: application/json" -d "$(jq -n --arg t "Nightly live AI evals failed: $RUN" '{content: $t}')" "$WEBHOOK" > /dev/null
