# Doc 04 "CI quality gates": five checks run in parallel on every pull request,
# and any failure blocks the merge. Live AI, Lighthouse and k6 run outside PRs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Placeholders only: CI never sees real keys, and AI calls use recorded
# responses (doc 04, V3). Turnstile values are Cloudflare's public test keys.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  META_MODE: recorded

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Fails below 80% line coverage on src/server (doc 04, V4).
      - run: pnpm test

  database:
    name: Database and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase test db

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Errata E-01: pnpm audit, not npm audit.
      - run: pnpm audit --prod --audit-level high
      - name: Semgrep (free rulesets)
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.181.1
          semgrep scan --config p/default --config p/secrets --error --metrics off
          --exclude node_modules --exclude .next --exclude "*.pdf"
      - run: pnpm build
      - run: pnpm check:bundle

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
