<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Shelf Voice: offline</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f5f7; --surface: #fff; --ink: #101010; --ink-2: #5f6168; --red: #c8141f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --surface: #1c1c1e; --ink: #f5f5f7; --ink-2: #a1a1a6; --red: #d63340; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--surface); border-radius: 22px; padding: 32px 24px; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 24px; line-height: 30px; margin: 16px 0 8px; }
  p { color: var(--ink-2); margin: 0 0 24px; }
  button { width: 100%; min-height: 52px; border: 0; border-radius: 16px; background: var(--red); color: #fff; font: 600 16px/1 inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Shelf Voice needs the internet to load this screen. Your shop is safe; try again when you're connected.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
